name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐋 ${{ matrix.mcu || 'No MCU' }} image
    # Open pull requests publish development images, merged ones publish the release images
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mcu: ["", G4, H7, F4, F1]

    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v7

      - name: 🏷️ Extract image tags
        id: tags
        env:
          BRANCH: ${{ github.head_ref }}
          MCU: ${{ matrix.mcu }}
          RELEASE: ${{ github.event.pull_request.merged }}
        run: |
          if [[ ! "$BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch name must follow the 'vx.y.z' pattern."
            exit 1
          fi

          version="${BRANCH#v}"
          suffix="${MCU:+-${MCU,,}}"

          if [[ "$RELEASE" == "true" ]]; then
            tags="ghcr.io/thunderatz/stm32cubemx:${version}${suffix},thunderatz/stm32cubemx:${version}${suffix}"
          else
            tags="ghcr.io/thunderatz/stm32cubemx:${version}-dev${suffix}"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/thunderatz/stm32cubemx:${version}${suffix}" >> "$GITHUB_OUTPUT"

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub
        if: github.event.pull_request.merged
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐋 Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MCU=${{ matrix.mcu }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=inline
